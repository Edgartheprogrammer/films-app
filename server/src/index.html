<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <button id="loadContentButton" onclick=""> Load Films</button>
    <div class="container">
    <table id="films-table">
        <tr class="tr">
            <th class="th">Id</th>
            <th class="th">Title</th>
            <th class="th">Year</th>
            <th class="th">Director</th>
            
        </tr>
    </table>

    <section>
        <h2>Add/Edit Film</h2>

        <form id="addFilmForm" action="#" method="post">
            <p>
                <label for="ID">Id: <input id="ID" type="text" name="ID"> </label>
            </p>

            <p>
            <label for="Title">Title: <input id="Title" type="text" name="Title"></label>
            </p>

            <p>
            <label for="Director">Director: <input id="Director" type="text" name="Director"></label>
            </p>

            <p>
            <label for="Year">Year: <input id="Year" type="text" name="Year"></label>
            </p>
            
            <input type="submit" value="Add" class="btn-add">
            
        </form>
    </section>
    </div>
    
    <script src="services.js"></script>
    
</body>
</html>
